{% extends "civilengineering/index.html" %}

{% block content %}

<div class="container mt-5">

    <h1>{{ movie.title }}</h1>

    {% if movie.video %}

    <iframe width="100%" height="500" src="https://www.youtube.com/embed/{{ movie.video }}" allowfullscreen>
    </iframe>

    {% endif %}

    {% if movie.uploaded_video %}

    <video controls autoplay width="100%">

        <source src="{{ movie.uploaded_video.url }}" type="video/mp4">

    </video>

    {% endif %}

</div>

{% endblock %}
